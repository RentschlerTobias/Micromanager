[project]
name = "mm-evolver"
version = "0.1.0"
description = "OpenEvolve as micromanager's evolver: a fitness contract's evaluator, models through OpenCode"
requires-python = ">=3.12"
dependencies = [
    "openevolve==0.4.0",
]

[project.scripts]
mm-evolve = "mm_evolve.run:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mm_evolve"]
