[project]
name = "jev-decider"
version = "0.1.0"
description = "Local GLiNER2 decision server for jev-micromanager, speaking the TypeSafe Jev wire format"
requires-python = ">=3.12"
dependencies = [
    "gliner2[local]>=2.0.0",
    "protobuf>=5",
    "sentencepiece>=0.2",
    "torch>=2.6",
]

[project.scripts]
jev-decider = "decider.server:main"

# CPU-only torch: the 4060 stays free for llama-swap and the NPU for Whisper.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decider"]
